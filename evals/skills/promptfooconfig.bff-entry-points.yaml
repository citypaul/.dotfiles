# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# bff-entry-points quality evaluation. See promptfooconfig.tdd.yaml for the
# shape; graders live in bff-entry-points-assertions.js. Run with
# ./run-quality.sh bff-entry-points.
description: bff-entry-points quality — does the agent protect the entry surface the way the bff-entry-points skill promises?

prompts:
  - '{{request}}'

x-agent: &agent
  model: '{{env.SKILL_EVAL_MODEL}}'
  apiKeyRequired: false
  working_dir: '{{env.SKILL_EVAL_WORKSPACE}}'
  append_allowed_tools: ['Write', 'Edit', 'MultiEdit', 'Bash']
  permission_mode: acceptEdits
  # Bash runs inside the SDK sandbox with no network; pnpm install ran before
  # the eval, so tests and typecheck need none.
  sandbox:
    enabled: true
    autoAllowBashIfSandboxed: true
    network:
      allowLocalBinding: true
  web_search_enabled: false
  max_turns: 80
  persist_session: false

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skills
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
  - id: anthropic:claude-agent-sdk
    label: no-skills
    config:
      <<: *agent
      setting_sources: []
  # Same bundle, but told to load the skill under test first. Against
  # no-skills this isolates what the skill body is worth; against with-skills
  # it isolates whether routing fires on its own.
  - id: anthropic:claude-agent-sdk
    label: skill-forced
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
      append_system_prompt: "Before doing anything else in this task, load the `bff-entry-points` skill with the Skill tool and follow it."

extensions:
  - file://quality-hooks.js:extensionHook

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - { type: javascript, value: 'file://bff-entry-points-assertions.js:routesMountedThroughRegistrar', metric: routes-mounted-through-registrar, weight: 2 }
    - { type: javascript, value: 'file://bff-entry-points-assertions.js:noWeakeningFlags', metric: no-weakening-flags }
    - { type: javascript, value: 'file://bff-entry-points-assertions.js:principalStaysProviderFree', metric: principal-stays-provider-free }
    - { type: javascript, value: 'file://bff-entry-points-assertions.js:behaviourDelivered', metric: behaviour-delivered, weight: 2 }
    - { type: javascript, value: 'file://bff-entry-points-assertions.js:suiteGreen', metric: suite-green }
    - { type: javascript, value: 'file://bff-entry-points-assertions.js:typecheckClean', metric: typecheck-clean }

tests: file://tests/bff-entry-points-quality.yaml
