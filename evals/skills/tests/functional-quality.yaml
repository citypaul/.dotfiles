# functional quality cases.
#
# The fixture declares "pure transformations over immutable data" (README.md,
# CLAUDE.md) but src/basket.ts shows none of it: every function mutates the
# basket it is given and returns it, walks lines with index loops, nests
# `if` three deep, and takes five positional parameters. Its tests only read
# return values, so nothing depends on the mutation. An agent that matches
# the surrounding style writes the same thing; the skill has to supply the
# rules. Every grader in functional-assertions.js reads only the lines the
# agent added (git diff against the committed fixture), so fixture code the
# agent left alone is never held against it.
#
# Each request pins only what the hidden acceptance test calls: a function
# name, its inputs in words, and the totals `basketTotal` must then report.
# The hidden tests deep-freeze every input, so a transformation that writes
# into its arguments throws instead of passing.
#
# Case 1 (voucher): "they show the conventions" tempts `line.unitPence = …`
#   inside an index loop over the basket it was handed (catalogue: property
#   assignment, `for` where `map` expresses it).
# Case 2 (merge): "lean on addLine" tempts `addLine(first, …)` — the fixture
#   helper writes into the basket it is given — followed by an in-place
#   `first.lines.sort()`, i.e. modifying an argument (skill: "doesn't ...
#   modify arguments"); the immutable shape folds into a copy or builds a
#   fresh array.
# Case 3 (bulk prices): the rule shape must be typed, so `readonly` on that
#   type (single-line, multi-line or inline `{ … }[]`) is always measured;
#   "sort the rules largest-minimum-first" tempts `rules.sort(…)` on the
#   caller's array where `[...rules].sort(…)` / `toSorted` is the catalogue's
#   alternative; the fixture style adds for → if → if nesting.

- description: half-price voucher
  vars:
    acceptance: voucher.test.ts
    request: >-
      Add vouchers to src/basket.ts: `applyVoucher(basket, code)`. A code of
      the form `HALF-<sku>` halves the unit price of that sku's line, rounding
      down to whole pence, so `basketTotal` reflects it; applying the same
      code again halves it again. A code for a sku that is not in the basket,
      or a code in any other form, leaves the basket as it was. Keep it next to
      the other helpers in that file — they show the conventions — and make
      sure it's tested.

- description: merge two baskets
  vars:
    acceptance: merge.test.ts
    request: >-
      Add `mergeBaskets(first, second)` to src/basket.ts for when a shopper
      signs in and their guest basket joins their saved one. The result has
      every line from both; where both baskets have the same sku the
      quantities add up and the first basket's name and unit price are kept;
      lines end up in plain string order of sku. The currency is the first
      basket's (assume they match). `addLine` already knows how to fold one
      line into a basket, so lean on it rather than writing that logic
      twice. Test it.

- description: bulk prices
  vars:
    acceptance: bulk-prices.test.ts
    request: >-
      Add bulk pricing to src/basket.ts: `applyBulkPrices(basket, rules)`,
      where each rule has a `sku`, a `minQuantity` and a `bulkUnitPence`. A
      line whose quantity is at least a rule's minimum takes that rule's unit
      price; if several rules for the same sku apply, the one with the
      largest minimum wins (simplest is to sort the rules largest-minimum
      first and take the first match); lines with no applicable rule are
      unchanged, and so is a basket with no rules. `basketTotal` must reflect
      the new prices. Tested, please.
