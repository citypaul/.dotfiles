# Skill-routing cases. Each request is written the way a developer would type
# it — it never names a skill. `expect` is the skill that should load;
# `quiet` lists the adjacent skills that should NOT load for this request.
#
# Grouped by the clusters where descriptions overlap most. When a case fails,
# the fix is almost always in the losing or winning skill's frontmatter
# description, not in this file.

# ---------------------------------------------------------------- testing ---

- description: tdd — new behaviour in tested code
  metadata: { cluster: testing }
  vars:
    request: "Add the ability to archive a note in src/notes.ts — an archived note should drop out of searchNotes results. Go ahead and implement it."
  assert:
    - { type: skill-used, value: tdd }
    - { type: not-skill-used, value: characterisation-tests }

- description: testing — restructuring brittle tests
  metadata: { cluster: testing }
  vars:
    request: "src/notes.test.ts breaks every time we touch the implementation even when behaviour hasn't changed. How should these tests be written instead? Show me what you'd change."
  assert:
    - { type: skill-used, value: testing }
    - { type: not-skill-used, value: mutation-testing }

- description: mutation-testing — coverage is high but bugs slip through
  metadata: { cluster: testing }
  vars:
    request: "We're at 100% line coverage on src/notes.ts and a bug still shipped last week. How do I find out which of our tests are actually weak?"
  assert:
    - { type: skill-used, value: mutation-testing }
    - { type: not-skill-used, value: testing }

- description: test-design-reviewer — assess an existing test file
  metadata: { cluster: testing }
  vars:
    request: "Review the quality of src/notes.test.ts as a test suite. Is it well designed? Don't change anything."
  assert:
    - { type: skill-used, value: test-design-reviewer }
    - { type: not-skill-used, value: mutation-testing }

- description: characterisation-tests — legacy code without tests
  metadata: { cluster: testing }
  vars:
    request: "I need to change the EU pricing rule in src/legacy/pricing.js but there are no tests and nobody remembers what all those branches do. What should I do first?"
  assert:
    - { type: skill-used, value: characterisation-tests }
    - { type: not-skill-used, value: tdd }

- description: finding-seams — untestable dependencies
  metadata: { cluster: testing }
  vars:
    request: "I can't unit test src/legacy/report.ts — it news up a Database in the constructor and reads Date.now() and process.env directly. How do I get this under test without a big rewrite?"
  assert:
    - { type: skill-used, value: finding-seams }
    - { type: not-skill-used, value: refactoring }

- description: react-testing — tests for a React component
  metadata: { cluster: testing }
  vars:
    request: "Write tests for the CheckoutForm component in src/checkout-form.tsx covering the error message and the disabled button while submitting."
  assert:
    - { type: skill-used, value: react-testing }

- description: front-end-testing — end-to-end browser flow
  metadata: { cluster: testing }
  vars:
    request: "Write a Playwright end-to-end test that signs in, creates a note, and checks it appears in the list. What's the right evidence boundary for this?"
  assert:
    - { type: skill-used, value: front-end-testing }
    - { type: not-skill-used, value: react-testing }

# ------------------------------------------------------------ architecture ---

- description: refactoring — clean up tested code
  metadata: { cluster: architecture }
  vars:
    request: "src/notes.ts is getting messy. The tests are green — clean it up without changing what it does."
  assert:
    - { type: skill-used, value: refactoring }
    - { type: not-skill-used, value: reduce-system-complexity }

- description: reduce-system-complexity — fewer moving parts on one path
  metadata: { cluster: architecture }
  vars:
    request: "src/sync/sync-notes.ts has three feature flags, a retry queue, a cache and a legacy fallback. I want fewer moving parts on that path with identical behaviour, and I want proof that complexity actually went away rather than moving somewhere else. Start with a diagnosis."
  assert:
    - { type: skill-used, value: reduce-system-complexity }
    - { type: not-skill-used, value: refactoring }

- description: structure-codebase — where files should live
  metadata: { cluster: architecture }
  vars:
    request: "src/ is turning into a flat pile of files. How should we organise this project's folders so the boundaries are obvious? Propose a tree."
  assert:
    - { type: skill-used, value: structure-codebase }
    - { type: not-skill-used, value: codebase-design }

- description: improve-codebase-architecture — where would investment pay off
  metadata: { cluster: architecture }
  vars:
    request: "Audit this repo and tell me where architecture investment would pay off most. I want a few ranked options, not a rewrite plan."
  assert:
    - { type: skill-used, value: improve-codebase-architecture }
    - { type: not-skill-used, value: structure-codebase }

- description: codebase-design — one module's interface
  metadata: { cluster: architecture }
  vars:
    request: "I'm about to turn src/notes.ts into a NotesStore module that the UI and the sync code both call. What should its interface look like, and what should stay hidden inside it?"
  assert:
    - { type: skill-used, value: codebase-design }
    - { type: not-skill-used, value: api-design }

- description: hexagonal-architecture — explicit ports and adapters
  metadata: { cluster: architecture }
  vars:
    request: "This project uses hexagonal architecture. Add a port for sending the weekly report email so src/legacy/report.ts stops depending on the mailer directly."
  assert:
    - { type: skill-used, value: hexagonal-architecture }

- description: domain-driven-design — aggregate with invariants
  metadata: { cluster: architecture }
  vars:
    request: "We're doing DDD on the sharing feature. Model a SharedNote aggregate — invariants are that a note can be shared with at most 10 people and only the owner can revoke."
  assert:
    - { type: skill-used, value: domain-driven-design }
    - { type: not-skill-used, value: event-sourcing }

- description: event-sourcing — events as the source of truth
  metadata: { cluster: architecture }
  vars:
    request: "We want to keep the full history of edits to a note and be able to rebuild any past version. Persist the changes as events and derive current state from them. How would you structure the write model?"
  assert:
    - { type: skill-used, value: event-sourcing }

# ----------------------------------------------------------------- api/bff ---

- description: api-design — public REST contract
  metadata: { cluster: api }
  vars:
    request: "Design the public REST API for notes that third-party integrations will call — listing with pagination, errors, and how we'll version it."
