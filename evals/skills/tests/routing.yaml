    - { type: skill-used, value: bff-entry-points }
    - { type: not-skill-used, value: bff-design }

- description: secure-oauth-oidc — PKCE login
  metadata: { cluster: api }
  vars:
    request: "Implement sign-in against our OpenID Connect provider from the web app using the authorization code flow with PKCE. What do I need to get right?"
