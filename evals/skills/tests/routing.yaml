    - { type: skill-used, value: secure-oauth-oidc }
    - { type: not-skill-used, value: bff-entry-points }

- description: cli-design — command-line tool
  metadata: { cluster: api }
  vars:
    request: "Build a small CLI, `notes export`, that prints notes as a table by default and as JSON with --json, and exits non-zero when the notes file can't be read."
  assert:
    - { type: skill-used, value: cli-design }

# ---------------------------------------------------------------- planning ---

