    - { type: skill-used, value: api-design }
    - { type: not-skill-used, value: bff-design }

- description: bff-design — whether and how many BFFs
  metadata: { cluster: api }
  vars:
    request: "We're adding an iOS app next to the web app. Should both clients share one backend, or should each get its own backend-for-frontend? What are the trade-offs?"
