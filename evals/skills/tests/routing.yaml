    - { type: not-skill-used, value: panel-review }

# --------------------------------------------------------------- debugging ---

- description: ci-debugging — passes locally, fails in CI
  metadata: { cluster: debugging }
  vars:
    request: "The test suite passes on my machine but fails on GitHub Actions with a timeout in notes.test.ts. Help me work out why."
  assert:
    - { type: skill-used, value: ci-debugging }
    - { type: not-skill-used, value: debugging }

- description: debugging — runtime failure, diagnosis only
  metadata: { cluster: debugging }
  vars:
    request: "About one time in ten, after saving a note the list shows the old title until you reload. Find the cause. Don't fix anything yet."
