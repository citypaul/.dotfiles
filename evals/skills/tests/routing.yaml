- description: no skill — trivial rename
  metadata: { cluster: negative }
  vars:
    request: "In src/notes.ts rename the local variable `q` in searchNotes to `needle`."
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse?.metadata?.toolCalls || [];
        const loaded = calls.filter((c) => c.name === 'Skill').map((c) => c.input?.skill);
        return {
          pass: loaded.length === 0,
          score: loaded.length === 0 ? 1 : 0,
          reason: loaded.length === 0 ? 'no skill loaded' : `loaded ${loaded.join(', ')}`,
        };

- description: no skill — factual question about the code
  metadata: { cluster: negative }
  vars:
    request: "Which files import from src/sync/flags.ts?"
  assert:
    - type: javascript
      value: |
        const calls = context.providerResponse?.metadata?.toolCalls || [];
        const loaded = calls.filter((c) => c.name === 'Skill').map((c) => c.input?.skill);
        return {
          pass: loaded.length === 0,
          score: loaded.length === 0 ? 1 : 0,
          reason: loaded.length === 0 ? 'no skill loaded' : `loaded ${loaded.join(', ')}`,
        };

