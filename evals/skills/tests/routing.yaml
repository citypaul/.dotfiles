    - { type: skill-used, value: bff-design }
    - { type: not-skill-used, value: bff-entry-points }

- description: bff-entry-points — protecting a browser-facing route
  metadata: { cluster: api }
  vars:
    request: "Add a POST /api/notes/export route to our browser-facing backend. It must only work for a logged-in session and must not be callable from another site."
