# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# cli-design quality evaluation. See promptfooconfig.tdd.yaml for the shape;
# graders live in cli-design-assertions.js. Run with
# ./run-quality.sh cli-design.
description: cli-design quality — does the agent build the CLI the way the skill promises?

prompts:
  - '{{request}}'

x-agent: &agent
  model: '{{env.SKILL_EVAL_MODEL}}'
  apiKeyRequired: false
  working_dir: '{{env.SKILL_EVAL_WORKSPACE}}'
  append_allowed_tools: ['Write', 'Edit', 'MultiEdit', 'Bash']
  permission_mode: acceptEdits
  # Bash runs inside the SDK sandbox with no network; pnpm install ran before
  # the eval, so tests and typecheck need none.
  sandbox:
    enabled: true
    autoAllowBashIfSandboxed: true
    network:
      allowLocalBinding: true
  web_search_enabled: false
  max_turns: 80
  persist_session: false

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skills
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
  - id: anthropic:claude-agent-sdk
    label: no-skills
    config:
      <<: *agent
      setting_sources: []
  # Same bundle, but told to load the skill under test first. Against
  # no-skills this isolates what the skill body is worth; against with-skills
  # it isolates whether routing fires on its own.
  - id: anthropic:claude-agent-sdk
    label: skill-forced
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
      append_system_prompt: "Before doing anything else in this task, load the `cli-design` skill with the Skill tool and follow it."

extensions:
  - file://quality-hooks.js:extensionHook

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - { type: javascript, value: 'file://cli-design-assertions.js:progressOffStdout', metric: progress-off-stdout }
    - { type: javascript, value: 'file://cli-design-assertions.js:jsonSuccessEnvelope', metric: json-success-envelope }
    - { type: javascript, value: 'file://cli-design-assertions.js:nonZeroExitExplainsOnStderr', metric: non-zero-exit-explains-on-stderr }
    - { type: javascript, value: 'file://cli-design-assertions.js:failuresKeepStdoutClean', metric: failures-keep-stdout-clean }
    - { type: javascript, value: 'file://cli-design-assertions.js:handlersDoNotPrintOrExit', metric: handlers-do-not-print-or-exit }
    - { type: javascript, value: 'file://cli-design-assertions.js:behaviourDelivered', metric: behaviour-delivered, weight: 2 }
    - { type: javascript, value: 'file://cli-design-assertions.js:suiteGreen', metric: suite-green }
    - { type: javascript, value: 'file://cli-design-assertions.js:typecheckClean', metric: typecheck-clean }

tests: file://tests/cli-design-quality.yaml
