# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: find-skills quality — does recommendation evidence verify current commands?

prompts:
  - '{{request}}'

x-agent: &agent
  model: '{{env.SKILL_EVAL_MODEL}}'
  apiKeyRequired: false
  working_dir: '{{env.SKILL_EVAL_WORKSPACE}}'
  append_allowed_tools: ['Write', 'Edit', 'MultiEdit']
  permission_mode: acceptEdits
  sandbox:
    enabled: true
    autoAllowBashIfSandboxed: true
  web_search_enabled: false
  max_turns: 40
  persist_session: false

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skills
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
  - id: anthropic:claude-agent-sdk
    label: no-skills
    config:
      <<: *agent
      setting_sources: []
  - id: anthropic:claude-agent-sdk
    label: skill-forced
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
      append_system_prompt: "Before doing anything else in this task, load the `find-skills` skill with the Skill tool and follow it."

extensions:
  - file://quality-hooks.js:extensionHook

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - { type: javascript, value: 'file://find-skills-assertions.js:artifactWritten', metric: artifact-written }
    - { type: javascript, value: 'file://find-skills-assertions.js:authoritativeEvidenceUsed', metric: authoritative-evidence-used }
    - { type: javascript, value: 'file://find-skills-assertions.js:currentVersionResolved', metric: current-version-resolved }
    - { type: javascript, value: 'file://find-skills-assertions.js:commandValidated', metric: command-validated }

tests: file://tests/find-skills-quality.yaml
