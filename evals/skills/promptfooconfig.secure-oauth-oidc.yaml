# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# secure-oauth-oidc quality evaluation.
#
# The routing suite (promptfooconfig.yaml) asks whether the right skill loads.
# This suite asks what the agent then does: given a sign-in to finish, deep
# links to carry through it, or a second issuer to add, does it hold the
# invariants the secure-oauth-oidc skill states — S256 PKCE, a one-time state
# bound to the initiating browser, exact redirect-URI matching, no open
# redirector at the client boundary, an ID token validated as a protocol
# object rather than a signature, tokens kept off the wire and out of the log,
# the issuer bound to the transaction — and does sign-in still work.
#
# Three providers run every case: the skills bundle as installed, the same
# agent with no skills at all, and the bundle with the skill under test
# force-loaded. forced vs no-skills is what the skill body is worth;
# with-skills vs forced is whether routing fires on its own.
#
# Run it with ./run-quality.sh secure-oauth-oidc. Cases run one at a time in
# a shared workspace that quality-hooks.js resets between cases.
description: secure-oauth-oidc quality — does the agent hold the OAuth/OIDC protocol invariants the skill states?

prompts:
  - '{{request}}'

x-agent: &agent
  model: '{{env.SKILL_EVAL_MODEL}}'
  apiKeyRequired: false
  working_dir: '{{env.SKILL_EVAL_WORKSPACE}}'
  append_allowed_tools: ['Write', 'Edit', 'MultiEdit', 'Bash']
  permission_mode: acceptEdits
  # Bash runs inside the SDK sandbox with no network; pnpm install ran before
  # the eval, so tests and typecheck need none.
  sandbox:
    enabled: true
    autoAllowBashIfSandboxed: true
    network:
      allowLocalBinding: true
  web_search_enabled: false
  max_turns: 80
  persist_session: false

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skills
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
  - id: anthropic:claude-agent-sdk
    label: no-skills
    config:
      <<: *agent
      setting_sources: []
  # Same bundle, but told to load the skill under test first. Against
  # no-skills this isolates what the skill body is worth; against with-skills
  # it isolates whether routing fires on its own.
  - id: anthropic:claude-agent-sdk
    label: skill-forced
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
      append_system_prompt: "Before doing anything else in this task, load the `secure-oauth-oidc` skill with the Skill tool and follow it."

extensions:
  - file://quality-hooks.js:extensionHook

evaluateOptions:
  maxConcurrency: 1

# `behaviourDelivered` is per case rather than shared, because each case names
# its own hidden test; it carries weight 2 everywhere.
# `noFalseAssuranceOffered` is a guard, not a discriminator: it can penalise an
# arm whose hand-back repeats one of the hand-off note's assurances as its own
# reason for leaving something alone, never separate two arms that do not.
defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - { type: javascript, value: 'file://secure-oauth-oidc-assertions.js:noFalseAssuranceOffered', metric: no-false-assurance-offered }
    - { type: javascript, value: 'file://secure-oauth-oidc-assertions.js:suiteGreen', metric: suite-green }
    - { type: javascript, value: 'file://secure-oauth-oidc-assertions.js:typecheckClean', metric: typecheck-clean }

tests: file://tests/secure-oauth-oidc-quality.yaml
