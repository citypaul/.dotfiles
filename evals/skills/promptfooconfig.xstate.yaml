# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# xstate quality evaluation. See promptfooconfig.tdd.yaml for the shape;
# graders live in xstate-assertions.js. Run with ./run-quality.sh xstate.
description: xstate quality — does the agent model the flow the way the xstate skill promises?

prompts:
  - '{{request}}'

x-agent: &agent
  model: '{{env.SKILL_EVAL_MODEL}}'
  apiKeyRequired: false
  working_dir: '{{env.SKILL_EVAL_WORKSPACE}}'
  append_allowed_tools: ['Write', 'Edit', 'MultiEdit', 'Bash']
  permission_mode: acceptEdits
  # Bash runs inside the SDK sandbox with no network; pnpm install ran before
  # the eval, so tests and typecheck need none.
  sandbox:
    enabled: true
    autoAllowBashIfSandboxed: true
    network:
      allowLocalBinding: true
  web_search_enabled: false
  max_turns: 80
  persist_session: false

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skills
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
  - id: anthropic:claude-agent-sdk
    label: no-skills
    config:
      <<: *agent
      setting_sources: []
  # Same bundle, but told to load the skill under test first. Against
  # no-skills this isolates what the skill body is worth; against with-skills
  # it isolates whether routing fires on its own.
  - id: anthropic:claude-agent-sdk
    label: skill-forced
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
      append_system_prompt: "Before doing anything else in this task, load the `xstate` skill with the Skill tool and follow it."

extensions:
  - file://quality-hooks.js:extensionHook

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - { type: javascript, value: 'file://xstate-assertions.js:flowModelledAsMachine', metric: flow-modelled-as-machine }
    - { type: javascript, value: 'file://xstate-assertions.js:componentDrivenByActor', metric: component-driven-by-actor }
    - { type: javascript, value: 'file://xstate-assertions.js:effectsAreActors', metric: effects-are-actors }
    - { type: javascript, value: 'file://xstate-assertions.js:eventsAreDomainShaped', metric: events-are-domain-shaped }
    - { type: javascript, value: 'file://xstate-assertions.js:namedImplementationsInSetup', metric: named-implementations-in-setup }
    - { type: javascript, value: 'file://xstate-assertions.js:noLegacyVocabulary', metric: no-legacy-vocabulary }
    - { type: javascript, value: 'file://xstate-assertions.js:mermaidRenderBesideMachine', metric: mermaid-render-beside-machine }
    - { type: javascript, value: 'file://xstate-assertions.js:machineTestedThroughEvents', metric: machine-tested-through-events }
    - { type: javascript, value: 'file://xstate-assertions.js:behaviourDelivered', metric: behaviour-delivered, weight: 2 }
    - { type: javascript, value: 'file://xstate-assertions.js:suiteGreen', metric: suite-green }
    - { type: javascript, value: 'file://xstate-assertions.js:typecheckClean', metric: typecheck-clean }

tests: file://tests/xstate-quality.yaml
