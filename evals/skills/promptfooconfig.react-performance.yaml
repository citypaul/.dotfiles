# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# react-performance quality evaluation.
#
# The routing suite (promptfooconfig.yaml) asks whether the right skill loads.
# This suite asks what the agent then does: given a genuinely slow React app,
# does it work the way the react-performance skill promises — a number taken
# before any code changes, the cost attributed, one hypothesis in the diff,
# the same measurement repeated afterwards, behaviour tests untouched, types
# and immutability intact — and does the app still behave.
#
# The suite's anchor is `measured-improvement`: after every case the graders
# re-run the fixture's own benchmark over the committed code and over the code
# the agent left, using the harness from HEAD in both, and require the number
# to have actually moved. Going through the motions of measuring is not enough
# and a confident reply is not evidence.
#
# Three providers run every case: the skills bundle as installed, the same
# agent with no skills at all, and the bundle with the skill under test
# force-loaded. forced vs no-skills is what the skill body is worth;
# with-skills vs forced is whether routing fires on its own.
#
# Run it with ./run-quality.sh react-performance. Cases run one at a time in a shared
# workspace that quality-hooks.js resets between cases.
description: react-performance quality — does the agent measure, change one thing, and re-measure?

prompts:
  - '{{request}}'

x-agent: &agent
  model: '{{env.SKILL_EVAL_MODEL}}'
  apiKeyRequired: false
  working_dir: '{{env.SKILL_EVAL_WORKSPACE}}'
  append_allowed_tools: ['Write', 'Edit', 'MultiEdit', 'Bash']
  permission_mode: acceptEdits
  # Bash runs inside the SDK sandbox with no network; pnpm install ran before
  # the eval, so tests and typecheck need none.
  sandbox:
    enabled: true
    autoAllowBashIfSandboxed: true
    network:
      allowLocalBinding: true
  web_search_enabled: false
  max_turns: 80
  persist_session: false

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skills
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
  - id: anthropic:claude-agent-sdk
    label: no-skills
    config:
      <<: *agent
      setting_sources: []
  # Same bundle, but told to load the skill under test first. Against
  # no-skills this isolates what the skill body is worth; against with-skills
  # it isolates whether routing fires on its own.
  - id: anthropic:claude-agent-sdk
    label: skill-forced
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
      append_system_prompt: "Before doing anything else in this task, load the `react-performance` skill with the Skill tool and follow it."

extensions:
  - file://quality-hooks.js:extensionHook

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - { type: javascript, value: 'file://react-performance-assertions.js:baselineMeasuredFirst', metric: baseline-measured-first }
    - { type: javascript, value: 'file://react-performance-assertions.js:reMeasuredAfterChange', metric: re-measured-after-change }
    - { type: javascript, value: 'file://react-performance-assertions.js:behaviourTestsUnchanged', metric: behaviour-tests-unchanged }
    - { type: javascript, value: 'file://react-performance-assertions.js:oneOptimisationPerDiff', metric: one-optimisation-per-diff }
    - { type: javascript, value: 'file://react-performance-assertions.js:noTypeEscapeOrSharedMutation', metric: no-type-escape-or-shared-mutation }
    - { type: javascript, value: 'file://react-performance-assertions.js:beforeAfterReported', metric: before-after-reported }
    - { type: javascript, value: 'file://react-performance-assertions.js:measuredImprovement', metric: measured-improvement, weight: 2 }
    - { type: javascript, value: 'file://react-performance-assertions.js:behaviourDelivered', metric: behaviour-delivered, weight: 2 }
    - { type: javascript, value: 'file://react-performance-assertions.js:suiteGreen', metric: suite-green }
    - { type: javascript, value: 'file://react-performance-assertions.js:typecheckClean', metric: typecheck-clean }

tests: file://tests/react-performance-quality.yaml
