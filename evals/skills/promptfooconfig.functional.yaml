# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# functional quality evaluation. See promptfooconfig.tdd.yaml for the shape;
# graders live in functional-assertions.js and read only the lines the agent
# added to src/. Run with ./run-quality.sh functional.
description: functional quality — does the agent transform data the way the functional skill promises?

prompts:
  - '{{request}}'

x-agent: &agent
  model: '{{env.SKILL_EVAL_MODEL}}'
  apiKeyRequired: false
  working_dir: '{{env.SKILL_EVAL_WORKSPACE}}'
  append_allowed_tools: ['Write', 'Edit', 'MultiEdit', 'Bash']
  permission_mode: acceptEdits
  # Bash runs inside the SDK sandbox with no network; pnpm install ran before
  # the eval, so tests and typecheck need none.
  sandbox:
    enabled: true
    autoAllowBashIfSandboxed: true
    network:
      allowLocalBinding: true
  web_search_enabled: false
  max_turns: 80
  persist_session: false

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skills
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
  - id: anthropic:claude-agent-sdk
    label: no-skills
    config:
      <<: *agent
      setting_sources: []
  # Same bundle, but told to load the skill under test first. Against
  # no-skills this isolates what the skill body is worth; against with-skills
  # it isolates whether routing fires on its own.
  - id: anthropic:claude-agent-sdk
    label: skill-forced
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
      append_system_prompt: "Before doing anything else in this task, load the `functional` skill with the Skill tool and follow it."

extensions:
  - file://quality-hooks.js:extensionHook

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - { type: javascript, value: 'file://functional-assertions.js:inputsNotMutated', metric: inputs-not-mutated, weight: 2 }
    - { type: javascript, value: 'file://functional-assertions.js:arrayMethodsOverLoops', metric: array-methods-over-loops }
    - { type: javascript, value: 'file://functional-assertions.js:earlyReturnsOverNesting', metric: early-returns-over-nesting }
    - { type: javascript, value: 'file://functional-assertions.js:readonlyContracts', metric: readonly-contracts }
    - { type: javascript, value: 'file://functional-assertions.js:behaviourDelivered', metric: behaviour-delivered, weight: 2 }
    - { type: javascript, value: 'file://functional-assertions.js:suiteGreen', metric: suite-green }
    - { type: javascript, value: 'file://functional-assertions.js:typecheckClean', metric: typecheck-clean }

tests: file://tests/functional-quality.yaml
