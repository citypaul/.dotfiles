# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
#
# domain-driven-design quality evaluation. See promptfooconfig.tdd.yaml for
# the shape; graders live in ddd-assertions.js. Run with
# ./run-quality.sh ddd.
description: domain-driven-design quality — does the agent model the domain the way the skill promises?

prompts:
  - '{{request}}'

x-agent: &agent
  model: '{{env.SKILL_EVAL_MODEL}}'
  apiKeyRequired: false
  working_dir: '{{env.SKILL_EVAL_WORKSPACE}}'
  append_allowed_tools: ['Write', 'Edit', 'MultiEdit', 'Bash']
  permission_mode: bypassPermissions
  allow_dangerously_skip_permissions: true
  max_turns: 80
  persist_session: false

providers:
  - id: anthropic:claude-agent-sdk
    label: with-skills
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
  - id: anthropic:claude-agent-sdk
    label: no-skills
    config:
      <<: *agent
      setting_sources: []
  # Same bundle, but told to load the skill under test first. Against
  # no-skills this isolates what the skill body is worth; against with-skills
  # it isolates whether routing fires on its own.
  - id: anthropic:claude-agent-sdk
    label: skill-forced
    config:
      <<: *agent
      setting_sources: ['project']
      skills: 'all'
      append_system_prompt: "Before doing anything else in this task, load the `domain-driven-design` skill with the Skill tool and follow it."

extensions:
  - file://quality-hooks.js:extensionHook

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    disableVarExpansion: true
  assert:
    - { type: javascript, value: 'file://ddd-assertions.js:glossaryVocabulary', metric: glossary-vocabulary, weight: 2 }
    - { type: javascript, value: 'file://ddd-assertions.js:brandedIds', metric: branded-ids }
    - { type: javascript, value: 'file://ddd-assertions.js:resultsNotThrows', metric: results-not-throws }
    - { type: javascript, value: 'file://ddd-assertions.js:immutableAndHonest', metric: immutable-and-honest }
    - { type: javascript, value: 'file://ddd-assertions.js:noClockInDomain', metric: no-clock-in-domain }
    - { type: javascript, value: 'file://ddd-assertions.js:testsSpeakTheLanguage', metric: tests-speak-the-language }
    - { type: javascript, value: 'file://ddd-assertions.js:behaviourDelivered', metric: behaviour-delivered, weight: 2 }
    - { type: javascript, value: 'file://ddd-assertions.js:suiteGreen', metric: suite-green }
    - { type: javascript, value: 'file://ddd-assertions.js:typecheckClean', metric: typecheck-clean }

tests: file://tests/ddd-quality.yaml
